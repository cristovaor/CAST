[project]
name = "cast-lsl-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.104", "uvicorn>=0.23", "pylsl>=1.17", "httpx>=0.25", "pydantic>=2.4"]

[project.scripts]
cast-lsl-agent = "cast_lsl_agent.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
