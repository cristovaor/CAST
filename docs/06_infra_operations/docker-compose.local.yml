# Exemplo reduzido apenas para dependências locais. Para a plataforma completa,
# use ../../docker-compose.yml, que também sobe API, workers e frontend.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cast_user
      POSTGRES_PASSWORD: cast_password
      POSTGRES_DB: cast_db
    ports:
      - "5432:5432"
    volumes:
      - cast_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    # minio/minio was removed from Docker Hub and quay.io; pgsty/minio is the
    # community-maintained build of the same server (same CLI, env and mc).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cast_minio:/data
volumes:
  cast_pg:
  cast_minio:
