services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cast
      POSTGRES_PASSWORD: cast
      POSTGRES_DB: cast
    ports:
      - "5432:5432"
    volumes:
      - cast_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: castminio
      MINIO_ROOT_PASSWORD: castminiopass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cast_minio:/data
volumes:
  cast_pg:
  cast_minio:
