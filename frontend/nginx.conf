# Static hosting for the CAST SPA.
#
# Runs on :8080 so the container needs no privileged port, and keeps every
# writable path under /tmp or /var/cache so the filesystem can stay read-only.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compose/EasyPanel healthcheck target. Answered by nginx itself so it
    # stays green even if the bundle is missing.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable: safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise browsers keep loading a stale
    # document that references assets deleted by the next deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are React Router's to resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA is served over HTTPS by the EasyPanel proxy; these headers are
    # cheap defence-in-depth for the document itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
